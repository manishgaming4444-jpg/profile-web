<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explore Profiles — XonPro</title>
    <meta name="description" content="Discover premium profile pages on XonPro. Browse and search all creators.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Outfit',sans-serif; background:#08080a; color:#fff; min-height:100vh; }

        /* ── TOPBAR ── */
        .topbar {
            height:60px; display:flex; align-items:center; justify-content:space-between;
            padding:0 2rem; background:#0d0d10;
            border-bottom:1px solid rgba(255,255,255,0.06);
            position:sticky; top:0; z-index:100;
        }
        .brand { display:flex; align-items:center; gap:0.6rem; text-decoration:none; }
        .brand img { height:32px; }
        .topbar-links { display:flex; gap:1rem; align-items:center; }
        .topbar-links a { color:rgba(255,255,255,0.45); text-decoration:none; font-size:0.85rem; transition:color 0.2s; }
        .topbar-links a:hover { color:#fff; }
        .btn-dash { padding:0.35rem 1rem; background:rgba(138,43,226,0.15); border:1px solid rgba(138,43,226,0.3); border-radius:50px; color:#c084fc; font-size:0.8rem; font-weight:600; }
        .btn-dash:hover { background:rgba(138,43,226,0.25) !important; color:#d8b4fe !important; }

        /* ── HERO ── */
        .hero {
            text-align:center; padding:4rem 2rem 2.5rem;
            background:radial-gradient(ellipse 80% 50% at 50% -20%,rgba(138,43,226,0.12),transparent);
        }
        .hero h1 { font-size:2.6rem; font-weight:800; letter-spacing:-1px; margin-bottom:0.6rem; }
        .hero h1 span { background:linear-gradient(135deg,#8a2be2,#ff007f,#00c8ff); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
        .hero p { color:rgba(255,255,255,0.4); font-size:1rem; margin-bottom:2rem; }
        .count-badge { display:inline-block; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08); border-radius:50px; padding:0.3rem 1rem; font-size:0.8rem; color:rgba(255,255,255,0.4); margin-bottom:1.5rem; }

        /* ── SEARCH ── */
        .search-wrap { max-width:520px; margin:0 auto; position:relative; }
        .search-wrap input {
            width:100%; padding:0.9rem 1.2rem 0.9rem 3rem;
            background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1);
            border-radius:50px; color:#fff; font-family:'Outfit',sans-serif; font-size:1rem;
            outline:none; transition:border-color 0.25s,box-shadow 0.25s;
        }
        .search-wrap input:focus { border-color:rgba(138,43,226,0.5); box-shadow:0 0 0 3px rgba(138,43,226,0.1); }
        .search-wrap input::placeholder { color:rgba(255,255,255,0.25); }
        .search-icon { position:absolute; left:1rem; top:50%; transform:translateY(-50%); font-size:1.1rem; opacity:0.4; }
        .search-btn {
            position:absolute; right:6px; top:50%; transform:translateY(-50%);
            padding:0.5rem 1.2rem; background:linear-gradient(135deg,#8a2be2,#c026d3);
            border:none; border-radius:50px; color:#fff; font-family:'Outfit',sans-serif;
            font-size:0.85rem; font-weight:700; cursor:pointer; transition:opacity 0.2s;
        }
        .search-btn:hover { opacity:0.85; }

        /* ── GRID ── */
        .explore-main { max-width:1100px; margin:0 auto; padding:2.5rem 1.5rem 4rem; }
        .explore-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:1rem; }

        /* ── CARD ── */
        .explore-card {
            display:flex; flex-direction:column; align-items:center;
            padding:1.5rem 1rem; gap:0.6rem;
            background:#111114; border:1px solid rgba(255,255,255,0.07);
            border-radius:18px; text-decoration:none; color:#fff;
            transition:border-color 0.25s, transform 0.25s, box-shadow 0.25s;
            cursor:pointer;
        }
        .explore-card:hover {
            border-color:rgba(138,43,226,0.4);
            transform:translateY(-4px);
            box-shadow:0 12px 40px rgba(138,43,226,0.15);
        }
        .explore-card img, .explore-card > div:first-child {
            width:64px; height:64px; border-radius:50%; object-fit:cover;
            border:2px solid rgba(255,255,255,0.15);
        }
        .ec-name { font-weight:700; font-size:0.95rem; text-align:center; margin-top:0.2rem; }
        .ec-user { font-size:0.75rem; color:rgba(255,255,255,0.35); }
        .ec-views { font-size:0.72rem; color:rgba(255,255,255,0.25); margin-top:0.2rem; }
        .ec-empty { grid-column:1/-1; text-align:center; padding:4rem; color:rgba(255,255,255,0.2); font-size:1rem; }

        @media (max-width:640px) {
            .hero { padding:2.5rem 1rem 1.5rem; }
            .hero h1 { font-size:1.7rem; }
            .hero p { font-size:0.88rem; }
            .topbar { padding:0 1rem; }
            .topbar-links a:not(.btn-dash) { display:none; }
            .explore-main { padding:1.5rem 0.8rem 3rem; }
            .explore-grid { grid-template-columns:repeat(2,1fr); gap:0.7rem; }
            .explore-card { padding:1.1rem 0.7rem; border-radius:14px; }
            .explore-card img, .explore-card > div:first-child { width:52px; height:52px; }
            .ec-name { font-size:0.85rem; }
            .search-wrap { max-width:100%; }
        }
        @media (max-width:360px) {
            .explore-grid { grid-template-columns:1fr 1fr; }
        }
    </style>
</head>
<body>
    <nav class="topbar">
        <a class="brand" href="/"><img src="/public/logo.png" alt="XonPro"></a>
        <div class="topbar-links">
            <a href="/create">Create Profile</a>
            <a href="/dashboard" class="btn-dash">Dashboard →</a>
        </div>
    </nav>

    <div class="hero">
        <div class="count-badge">✨ {{PROFILE_COUNT}} profiles</div>
        <h1>Discover <span>Creators</span></h1>
        <p>Browse premium profile pages on XonPro</p>
        <div class="search-wrap">
            <form action="/explore" method="GET">
                <span class="search-icon">🔍</span>
                <input type="text" name="q" placeholder="Search by name or username..." value="{{SEARCH_QUERY}}" autocomplete="off">
                <button type="submit" class="search-btn">Search</button>
            </form>
        </div>
    </div>

    <main class="explore-main">
        <div class="explore-grid">
            {{EXPLORE_CARDS}}
        </div>
    </main>
</body>
</html>
